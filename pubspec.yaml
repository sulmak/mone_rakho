name: mone_rakho
description: "Mone Rakho — dynamic notification/alarm app backed by a local NotificationMaster table, with List and Calendar views. Powered by Md. Atikur Rahman Mridha."
# Author by Md. Atikur Rahman Mridha (hidden)
publish_to: "none"
version: 3.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.1
  intl: ^0.19.0
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  table_calendar: ^3.1.2
  firebase_core: ^3.12.0
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.4.1
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  mailer: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"